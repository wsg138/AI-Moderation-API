[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "enthusia-ai-moderation"
version = "0.2.0"
description = "Fail-open central moderation service foundation for Enthusia"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.9,<3",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "psutil>=7.2,<8",
  "ruff>=0.8,<1",
]

w12-inference-test = [
  "numpy>=2.1,<3",
  "onnx>=1.17,<2",
  "onnxruntime>=1.20,<2",
]

[tool.setuptools.packages.find]
where = ["service"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["moderation_api"]
mypy_path = "service"
