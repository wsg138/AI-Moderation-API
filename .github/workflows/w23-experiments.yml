name: w23-precision-ensemble

on:
  push:
    branches: [w23/precision-ensemble-experiments]
    paths:
      - ".github/workflows/w23-experiments.yml"
      - "workers/w23/*.py"
      - "tests/test_w23.py"
      - "tools/check_complexity.py"
permissions:
  contents: read
  actions: read

concurrency:
  group: w23-precision-ensemble-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install experiment unit dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy==2.5.3 scikit-learn==1.9.1
          python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Ruff
        run: ruff check workers/w23 tests/test_w23.py tools/check_complexity.py
      - name: Complexity limits
        run: python tools/check_complexity.py
      - name: W23 tests
        run: pytest tests/test_w23.py

  bert-oof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        fold: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/w12/requirements-evidence.txt
      - name: Install pinned W12 evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r workers/w12/requirements-evidence.txt
          python -m pip install --disable-pip-version-check -e .
      - name: Train W11-train-only BERT Mini OOF fold
        run: python -m workers.w23.bert_support --fold ${{ matrix.fold }}
      - uses: actions/upload-artifact@v4
        with:
          name: w23-bert-oof-${{ matrix.fold }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: workers/w23/artifacts/oof/bert-mini-oof-fold-${{ matrix.fold }}.json

  experiment:
    needs: [unit, bert-oof]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/w12/requirements-evidence.txt
      - name: Install pinned evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r workers/w12/requirements-evidence.txt
          python -m pip install --disable-pip-version-check -e .
      - name: Download exact W12 BERT Mini candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: w12-bert-mini-3aac90ca8d0d57ca2174a852f961c6b753e7205d
          path: workers/w12
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 37225843627
      - name: Download train-only OOF folds
        uses: actions/download-artifact@v4
        with:
          pattern: w23-bert-oof-*-${{ github.sha }}
          path: workers/w23/artifacts/oof
          merge-multiple: true
      - name: Run validation-only W23 comparison
        run: python -m workers.w23.run_experiments
      - name: Record exact environment
        run: python -m pip freeze > workers/w23/reports/requirements-freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: w23-precision-ensemble-report-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            workers/w23/reports/comparison.json
            workers/w23/reports/comparison.md
            workers/w23/reports/requirements-freeze.txt
