name: Temporary Codacy diagnostics

on:
  push:
    branches:
      - api/support-context-read

jobs:
  codacy-pr-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public Codacy PR issues
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://api.codacy.com/api/v3/analysis/organizations/gh/wsg138/repositories/AI-Moderation-API/pull-requests/50/issues"
          cursor = None
          all_items = []
          while True:
              params = {"status": "new", "limit": "100"}
              if cursor:
                  params["cursor"] = cursor
              url = base + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json", "User-Agent": "enthusia-ci-diagnostic"},
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = json.load(response)
              all_items.extend(body.get("data", []))
              cursor = (body.get("pagination") or {}).get("cursor")
              if not cursor:
                  break
          print(json.dumps(all_items, indent=2, sort_keys=True))
          PY
