name: service-ci

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "deployment/**"
      - "service/**"
      - "tests/**"
      - "tools/**"
      - "data/synthetic/**"
      - "data/integration/**"
      - "docs/W11-DATASET-INTEGRATION-REPORT.md"
      - "docs/API-CONTRACT.md"
      - "docs/DEPLOYMENT.md"
      - "docs/DATASET-QA.md"
      - "docs/DATASET-SCHEMA.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "deployment/**"
      - "service/**"
      - "tests/**"
      - "tools/**"
      - "data/synthetic/**"
      - "data/integration/**"
      - "docs/W11-DATASET-INTEGRATION-REPORT.md"
      - "docs/API-CONTRACT.md"
      - "docs/DEPLOYMENT.md"
      - "docs/DATASET-QA.md"
      - "docs/DATASET-SCHEMA.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate deployment scripts
        run: bash -n deployment/install-runtime.sh deployment/run-service.sh
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r deployment/requirements-runtime.lock
      - name: Install service and development checks
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Complexity limits
        run: python tools/check_complexity.py
      - name: Dataset QA
        shell: bash
        run: |
          shopt -s nullglob
          files=(data/synthetic/*.jsonl)
          for file in "${files[@]}"; do
            python -m tools.dataset_qa validate "$file"
          done
      - name: G10-G27 final-byte report freshness
        run: python -m tools.dataset_qa.freshness
      - name: W11 integration reproducibility
        run: python -m tools.dataset_integration --check
      - name: Tests
        run: pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist

  experimental-language-pilot:
    # First-run PR-only evaluation. Normal service CI never needs model weights.
    if: github.event_name == 'pull_request' && github.head_ref == 'review/data-v2-12-fasttext-offline-pilot-20261008'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional fastText engine for isolated trial
        run: python -m pip install --only-binary=:all: "fasttext-community==0.11.8"
      - name: Download and verify licensed pretrained model
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = "https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz"
          digest = "8f3472cfe8738a7b6099e8e999c3cbfae0dcd15696aac7d7738a8039db603e83"
          with urlopen(Request(url, headers={"User-Agent": "Enthusia-LID-Offline/1"}), timeout=60) as response:
              raw = response.read(950000)
          assert len(raw) == 938013, "Incorrect pretrained file size"
          assert hashlib.sha256(raw).hexdigest() == digest, "Model digest drift"
          (Path(os.environ["RUNNER_TEMP"]) / "lid.176.ftz").write_bytes(raw)
          print("Verified original CC-BY-SA-3.0 language ID model SHA-256")
          PY
      - name: Actual model on public toy Minecraft-like chat
        shell: bash
        run: |
          python -m tools.data_v2.fasttext_language_candidate \
            --model "$RUNNER_TEMP/lid.176.ftz" \
            --samples data/policy-probes/fasttext-language-pilot-v1.jsonl
