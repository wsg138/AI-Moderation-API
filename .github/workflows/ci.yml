name: service-ci

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "service/**"
      - "tests/**"
      - "tools/**"
      - "docs/API-CONTRACT.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "pyproject.toml"
      - "service/**"
      - "tests/**"
      - "tools/**"
      - "docs/API-CONTRACT.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install service and development checks
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Complexity limits
        run: python tools/check_complexity.py
      - name: Tests
        run: pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
