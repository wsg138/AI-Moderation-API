name: Runtime foundation CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev tools
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: ruff check service tests tools
      - name: Mypy
        run: mypy service
      - name: Complexity limits
        run: python tools/check_complexity.py
      - name: Tests
        run: pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
