name: service-ci

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/w12-evidence.yml"
      - "workers/w12/**"
      - "workers/w23/**"
      - "pyproject.toml"
      - "deployment/**"
      - "service/**"
      - "tests/**"
      - "tools/**"
      - "data/synthetic/**"
      - "data/integration/**"
      - "docs/W11-DATASET-INTEGRATION-REPORT.md"
      - "docs/API-CONTRACT.md"
      - "docs/DEPLOYMENT.md"
      - "docs/DATASET-QA.md"
      - "docs/DATASET-SCHEMA.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/w12-evidence.yml"
      - "workers/w12/**"
      - "workers/w23/**"
      - "pyproject.toml"
      - "deployment/**"
      - "service/**"
      - "tests/**"
      - "tools/**"
      - "data/synthetic/**"
      - "data/integration/**"
      - "docs/W11-DATASET-INTEGRATION-REPORT.md"
      - "docs/API-CONTRACT.md"
      - "docs/DEPLOYMENT.md"
      - "docs/DATASET-QA.md"
      - "docs/DATASET-SCHEMA.md"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate deployment scripts
        run: bash -n deployment/install-runtime.sh deployment/run-service.sh
      - name: Install pinned runtime dependencies
        run: python -m pip install --disable-pip-version-check -r deployment/requirements-runtime.lock
      - name: Install service and development checks
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Install W12 ONNX fixture-test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[w12-inference-test]'
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Complexity limits
        run: python tools/check_complexity.py
      - name: Dataset QA
        shell: bash
        run: |
          shopt -s nullglob
          files=(data/synthetic/*.jsonl)
          for file in "${files[@]}"; do
            python -m tools.dataset_qa validate "$file"
          done
      - name: W11 integration reproducibility
        run: python -m tools.dataset_integration --check
      - name: Tests
        run: pytest
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
