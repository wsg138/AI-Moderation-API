name: language-detector-offline-pilot

on:
  pull_request:
    paths:
      - ".github/workflows/language-detector-offline-pilot.yml"
      - "tools/data_v2/fasttext_language_candidate.py"
      - "tools/data_v2/language_rule_probe.py"
      - "tests/test_fasttext_language_candidate.py"
      - "data/policy-probes/fasttext-language-pilot-v1.jsonl"
      - "policy/english-primary-message-action-v1.json"

permissions:
  contents: read

jobs:
  offline-model-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install optional fastText engine (pilot job only)
        run: python -m pip install --only-binary=:all: "fasttext-community==0.11.8"
      - name: Fetch official CC-BY-SA-3.0 LID model to runner temp (not repository)
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          url = "https://dl.fbaipublicfiles.com/fasttext/supervised-models/lid.176.ftz"
          expected = "8f3472cfe8738a7b6099e8e999c3cbfae0dcd15696aac7d7738a8039db603e83"
          dst = Path(os.environ["RUNNER_TEMP"]) / "lid.176.ftz"
          with urlopen(Request(url, headers={"User-Agent": "Enthusia-Offline-LID-Pilot/1"}), timeout=60) as response:
              data = response.read(950000)
          assert len(data) == 938013, "Unexpected model file size"
          assert hashlib.sha256(data).hexdigest() == expected, "Unexpected model SHA-256"
          dst.write_bytes(data)
          print("Pinned upstream model downloaded and SHA-256 verified (no redistribution)")
          PY
      - name: Run real model on public illustrative chat only
        shell: bash
        run: |
          python -m tools.data_v2.fasttext_language_candidate \
            --model "$RUNNER_TEMP/lid.176.ftz" \
            --samples data/policy-probes/fasttext-language-pilot-v1.jsonl
