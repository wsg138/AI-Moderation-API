name: w12-evidence

on:
  push:
    branches: [w12/model-training]
    paths:
      - ".github/workflows/w12-evidence.yml"
      - "workers/w12/baseline.py"
      - "workers/w12/dataset.py"
      - "workers/w12/evaluate.py"
      - "workers/w12/train_encoder.py"
      - "workers/w12/predict.py"
      - "workers/w12/run_validation_baseline.py"
      - "workers/w12/run_validation_candidate.py"
      - "workers/w12/run_baseline_onnx_evidence.py"
      - "workers/w12/export_baseline_onnx.py"
      - "workers/w12/requirements-evidence.txt"
      - "service/moderation_api/model_serialization.py"
      - "service/moderation_api/onnx_classifier.py"
      - "service/moderation_api/tfidf_runtime.py"
      - "tests/test_w12.py"

permissions:
  contents: read

concurrency:
  group: w12-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/w12/requirements-evidence.txt
      - name: Install pinned W12 evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r workers/w12/requirements-evidence.txt
          python -m pip install --disable-pip-version-check -e .
      - name: Train baseline on W11 train and evaluate validation only
        run: python -m workers.w12.run_validation_baseline
      - uses: actions/upload-artifact@v4
        with:
          name: w12-baseline-validation-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            workers/w12/artifacts/baseline-tfidf.pkl
            workers/w12/reports/val-baseline-tfidf.json

  encoder-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        candidate: [bert-tiny, bert-mini]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/w12/requirements-evidence.txt
      - name: Install pinned W12 evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r workers/w12/requirements-evidence.txt
          python -m pip install --disable-pip-version-check -e .
      - name: Train pretrained candidate on W11 train only
        run: >
          python -m workers.w12.train_encoder
          --candidate ${{ matrix.candidate }}
          --seed 42
          --epochs 5
          --batch-size 16
          --lr 3e-5
      - name: Evaluate candidate on validation only
        run: >
          python -m workers.w12.run_validation_candidate
          --candidate ${{ matrix.candidate }}
          --seed 42
      - name: Record exact environment
        run: python -m pip freeze > workers/w12/reports/requirements-evidence-freeze.txt
      - uses: actions/upload-artifact@v4
        with:
          name: w12-${{ matrix.candidate }}-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            workers/w12/artifacts/${{ matrix.candidate }}-seed42.pt
            workers/w12/artifacts/${{ matrix.candidate }}-seed42-history.json
            workers/w12/reports/val-${{ matrix.candidate }}-seed42.json
            workers/w12/reports/requirements-evidence-freeze.txt

  baseline-onnx:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: workers/w12/requirements-evidence.txt
      - name: Install pinned W12 evidence dependencies
        run: |
          python -m pip install --disable-pip-version-check -r workers/w12/requirements-evidence.txt
          python -m pip install --disable-pip-version-check -e .
      - name: Generate selected baseline ONNX evidence
        run: python -m workers.w12.run_baseline_onnx_evidence
      - name: Record exact environment
        if: always()
        run: python -m pip freeze > workers/w12/reports/requirements-evidence-freeze.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w12-baseline-onnx-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            workers/w12/artifacts/onnx/
            workers/w12/reports/onnx-baseline-evidence.json
            workers/w12/reports/val-baseline-tfidf.json
            workers/w12/reports/baseline-tfidf-onnx-metadata.json
            workers/w12/reports/baseline-tfidf-int8-onnx-metadata.json
            workers/w12/reports/requirements-evidence-freeze.txt
